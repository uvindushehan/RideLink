server:
  port: 8081

spring:
  application:
    name: account-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/account_service_db
      auto-index-creation: true

# SpringDoc / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  # SECURITY NOTE: In production, override JWT_SECRET with a strong, externally managed secret.
  # Example: export JWT_SECRET=<your-256-bit-base64-encoded-secret>
  # The fallback value below is for LOCAL DEVELOPMENT ONLY.
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

# ============================================================
# Fare Payment Service - Application Properties
# IT3130 AD Group Assignment
# ============================================================

# Server Configuration
server.port=8083

# Application Name
spring.application.name=fare-payment-service

# ============================================================
# MongoDB Configuration
# IMPORTANT: This service uses ONLY fare_payment_db.
# Do NOT connect to any other microservice database.
# ============================================================
spring.data.mongodb.uri=mongodb://localhost:27017/fare_payment_db

# ============================================================
# SpringDoc OpenAPI / Swagger UI Configuration
# Swagger UI: http://localhost:8083/swagger-ui/index.html
# OpenAPI JSON: http://localhost:8083/v3/api-docs
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ============================================================
# Logging
# ============================================================
logging.level.com.ridesystem.payment=DEBUG
logging.level.org.springframework.data.mongodb=INFO
